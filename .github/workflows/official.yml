name: Official

on:
  push:
    branches: [master, feature-test]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    env:
      CONAN_USER_HOME: C:\.conan

    steps:
      - uses: actions/checkout@v3
        with:
          path: wkhtmltopdf
          submodules: true

      - uses: actions/checkout@v3
        with:
          repository: vlavan/packaging
          path: packaging

      - name: Install Python & Conan
        shell: powershell
        run: |
          choco install -y python3
          python -m pip install --upgrade pip
          pip install conan

      - name: Verify Conan 2.x
        shell: powershell
        run: |
          conan --version
          where conan

      - name: Install Conan configuration
        shell: powershell
        run: |
          conan config install packaging/conan-config --type dir

      # ← Here we point the old VS140COMNTOOLS at VS2022’s vcvarsall.bat
      - name: Point packaging at VS2022’s vcvarsall.bat
        shell: pwsh
        run: |
          $vs2022Build = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build"
          echo "VS140COMNTOOLS=$vs2022Build" >> $Env:GITHUB_ENV

      - name: Build wkhtmltopdf natively
        shell: bash
        run: |
          cd packaging
          python build vagrant msvc2015-win64 --clean --version - - ../wkhtmltopdf

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: wkhtmltopdf-windows
          path: packaging/bin/wkhtmltopdf.exe
