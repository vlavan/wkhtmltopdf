name: Official

on:
  push:
    branches: [master, feature-test]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    env:
      CONAN_USER_HOME: C:\.conan

    steps:
      - uses: actions/checkout@v3
        with:
          path: wkhtmltopdf
          submodules: true

      - uses: actions/checkout@v3
        with:
          repository: vlavan/packaging
          path: packaging

      - name: Install Python & Conan
        run: |
          choco install -y python3
          python -m pip install --upgrade pip
          python -m pip install --upgrade conan

      - name: Verify Conan 2.x
        run: |
          conan --version
          where conan

        # ←←← NEW STEP TO SATISFY VS140COMNTOOLS
      - name: Locate Visual Studio & set VS140COMNTOOLS
        shell: pwsh
        run: |
          $vsInstall = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          $toolsDir = Join-Path $vsInstall 'Common7\Tools\'
          echo "VS140COMNTOOLS=$toolsDir" >> $env:GITHUB_ENV

      - name: Install Conan configuration
        run: |
          conan config install packaging/conan-config --type dir

      - name: Build wkhtmltopdf natively
        run: |
          cd packaging
          python build vagrant msvc2015-win64 `
            --clean `
            --version - - ../wkhtmltopdf
