name: Official
on:
  push:
    branches: [master, TestBranch]
  pull_request:
    branches: [master]
  workflow_dispatch:
jobs:
  windows:
    name: Qt 4.8 on Windows
    runs-on: windows-2022
    steps:
      - name: checkout source
        uses: actions/checkout@v2
        with:
          path: wkhtmltopdf
          submodules: true
      - name: checkout packaging
        uses: actions/checkout@v2
        with:
          repository: wkhtmltopdf/packaging
          path: packaging
      - name: Locate Visual Studio & set VS140COMNTOOLS
        shell: pwsh
        run: |
          # find the latest VS installation
          $vsInstall = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          # point the old VS140COMNTOOLS at its Common7\Tools folder
          $toolsDir = Join-Path $vsInstall 'Common7\Tools\'
          echo "VS140COMNTOOLS=$toolsDir" >> $env:GITHUB_ENV

      - name: setup build environment
        run: |
          choco install -yr --no-progress vcbuildtools -ia "/Full"
          pip install -q conan
          cmd /c attrib "C:\Program Files (x86)\Windows Kits\10\include\wdf" +H
      - name: build
        run: cd packaging && python ./build vagrant msvc2015-win64 --clean --version - - ../wkhtmltopdf
