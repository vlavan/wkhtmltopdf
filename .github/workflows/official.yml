name: Official

on:
  push:
    branches: [master, feature-test]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    env:
      CONAN_USER_HOME: C:\.conan

    steps:
      - uses: actions/checkout@v3
        with:
          path: wkhtmltopdf
          submodules: true

      - uses: actions/checkout@v3
        with:
          repository: wkhtmltopdf/packaging
          path: packaging

      - name: Setup Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install Conan 2.x
        run: |
          python -m pip install --upgrade pip
          python -m pip install conan

      - name: Verify Conan
        run: |
          conan --version
          where conan

      - name: Configure Conan profile
        run: |
          conan profile detect
          conan config set profiles.default.settings.compiler.runtime=dynamic
          conan config set profiles.default.settings.compiler.cppstd=14

      - name: Build wkhtmltopdf natively
        run: |
          cd packaging
          python build msvc2015-win64 \
            --clean \
            --version - - ../wkhtmltopdf
