name: Official
on:
  push:
    branches: [master, feature-test]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  windows:
    name: Qt 4.8 on Windows
    runs-on: windows-latest # ← use the current MS-hosted image
    env:
      CONAN_USER_HOME: C:\.conan # ← avoid Conan’s default in Documents
    steps:
      - name: checkout source
        uses: actions/checkout@v3 # ← update to v3
        with:
          path: wkhtmltopdf
          submodules: true

      - name: checkout packaging
        uses: actions/checkout@v3
        with:
          repository: wkhtmltopdf/packaging
          path: packaging

      - name: Install build tools & deps
        run: |
          choco install -y python3       # Python 3
          choco install -y visualstudio2019buildtools --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools"
          pip install --upgrade conan

      - name: Configure Conan
        run: |
          conan profile detect           # create default profile
          conan profile update settings.compiler.runtime=dynamic default

      - name: Build wkhtmltopdf natively
        run: |
          cd packaging
          python build msvc2015-win64 \
            --clean \
            --version - - ../wkhtmltopdf
