name: Official
on:
  push:
    branches: [master, TestBranch, fix-vs-path-setup]
  pull_request:
    branches: [master]
  workflow_dispatch:
jobs:
  windows:
    name: Qt 4.8 on Windows
    runs-on: windows-latest
    steps:
      - name: checkout source
        uses: actions/checkout@v3
        with:
          path: wkhtmltopdf
          submodules: true
      - name: checkout packaging
        uses: actions/checkout@v3
        with:
          repository: vlavan/packaging
          path: packaging
          ref: fix-vs-path-setup

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install Conan
        run: pip install conan

      - name: Generate default Conan profile
        run: conan profile detect

      - name: Create msvc2015-win64 profile
        run: conan profile new msvc2015-win64 --detect

      - name: Build wkhtmltopdf for msvc2015-win64
        working-directory: packaging
        run: |
          python ./build `
            vagrant `
            msvc2015-win64 `
            --clean `
            --version - - `
            ../wkhtmltopdf

      - name: Manually set VS140COMNTOOLS for script compatibility
        shell: pwsh
        run: |
          $vsInstall = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          $vcToolsPath = Join-Path $vsInstall 'VC\Auxiliary\Build'
          echo "VS140COMNTOOLS=$vcToolsPath" >> $env:GITHUB_ENV

      - name: Locate Visual Studio and expose vcvarsall.bat path
        shell: pwsh
        run: |
          $vsInstall = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          $vcVarsPath = Join-Path $vsInstall 'VC\Auxiliary\Build\vcvarsall.bat'
          echo "VCVARS_PATH=$vcVarsPath" >> $env:GITHUB_ENV

      - name: setup build environment
        run: |
          choco install -yr --no-progress vcbuildtools -ia "/Full"
          pip install -q conan
          cmd /c attrib "C:\Program Files (x86)\Windows Kits\10\include\wdf" +H
      - name: build
        run: cd packaging && python ./build vagrant msvc2015-win64 --clean --version - - ../wkhtmltopdf
