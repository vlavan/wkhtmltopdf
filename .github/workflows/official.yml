name: Official

on:
  push:
    branches: [master, feature-test]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  windows:
    name: Qt 4.8 on Windows
    runs-on: windows-latest
    env:
      CONAN_USER_HOME: C:\.conan

    steps:
      - name: checkout source
        uses: actions/checkout@v3
        with:
          path: wkhtmltopdf
          submodules: true

      - name: checkout packaging
        uses: actions/checkout@v3
        with:
          repository: wkhtmltopdf/packaging
          path: packaging

      - name: Install Conan 2.x
        run: pip install --upgrade conan

      - name: Install build tools & deps
        run: |
          choco install -y python3
          choco install -y visualstudio2019buildtools --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools"
          pip install --upgrade conan

      - name: Detect and configure Conan profile
        run: |
          conan profile detect
          conan config set profiles.default.settings.compiler.runtime=dynamic
          conan config set profiles.default.settings.compiler.cppstd=14
          # Add any other overrides you need, for example:
          # conan config set profiles.default.settings.compiler.version=194
          # conan config set profiles.default.settings.build_type=Release

      - name: Build wkhtmltopdf natively
        run: |
          cd packaging
          python build msvc2015-win64 \
            --clean \
            --version - - ../wkhtmltopdf
